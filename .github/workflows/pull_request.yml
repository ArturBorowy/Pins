name: Build and test (only debug)
run-name: PULL REQUEST workflow

on: [ pull_request ]

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create local.properties from secret
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: echo "MAPS_API_KEY=$MAPS_API_KEY" > local.properties

      - parallel:
          - name: Run Detekt
            run: bash ./gradlew detekt

          - name: Assemble debug
            run: bash ./gradlew assembleDebug

      - name: Verify screenshot tests
        run: bash ./gradlew verifyRoborazziLocalMockDebug

      - name: Run unit tests
        run: bash ./gradlew testLocalMockDebugUnitTest
